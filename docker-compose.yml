version: "3.9"

services:
  iereip-web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: iereip-web

    restart: unless-stopped

    # Host:3009 → Container:80 (Nginx default)
    ports:
      - "3009:80"

    env_file:
      - .env

    environment:
      NODE_ENV: production

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s